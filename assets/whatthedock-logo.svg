  <path d="M90 306 V392 M190 306 V392 M290 306 V392 M390 306 V392" stroke="#4b5968" stroke-width="14" stroke-linecap="round"/>
  <path d="M40 330 H502" stroke="#e8c170" stroke-width="8" stroke-linecap="round" stroke-dasharray="34 18"/>

