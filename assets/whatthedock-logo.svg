<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">WHAT THE DOCK?! logo</title>
  <desc id="desc">A funny terminal container sitting on a dock with a surprised face and the words WHAT THE DOCK?!</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101419"/>
      <stop offset="0.58" stop-color="#18222c"/>
      <stop offset="1" stop-color="#26313a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#80c990"/>
      <stop offset="1" stop-color="#e8c170"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#05070a" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1120" height="420" rx="34" fill="url(#sky)"/>
  <path d="M0 288 C120 268 177 316 290 292 C405 266 476 322 596 296 C727 268 793 315 905 292 C1010 270 1050 286 1120 272 L1120 420 L0 420 Z" fill="#0b1015"/>
