    <rect x="130" y="118" width="302" height="38" rx="8" fill="#26313a"/>
    <circle cx="151" cy="137" r="7" fill="#e06c75"/>
    <circle cx="174" cy="137" r="7" fill="#e8c170"/>
    <circle cx="197" cy="137" r="7" fill="#80c990"/>
    <path d="M146 190 L194 218 L146 246" fill="none" stroke="#80c990" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M230 250 H330" stroke="#7dcfff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="336" cy="205" r="13" fill="#e8edf2"/>
    <circle cx="386" cy="205" r="13" fill="#e8edf2"/>
    <circle cx="336" cy="205" r="5" fill="#101419"/>
    <circle cx="386" cy="205" r="5" fill="#101419"/>
    <path d="M345 248 Q362 266 382 248" fill="none" stroke="#e06c75" stroke-width="10" stroke-linecap="round"/>
    <path d="M396 75 C428 42 482 62 478 104 C474 144 418 132 428 98" fill="none" stroke="#e8c170" stroke-width="14" stroke-linecap="round"/>
    <circle cx="427" cy="151" r="8" fill="#e8c170"/>
