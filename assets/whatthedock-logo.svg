  <g transform="translate(522 78)">
    <text x="0" y="72" fill="#e8edf2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="67" font-weight="900" letter-spacing="2">WHAT THE</text>
    <text x="0" y="154" fill="#7dcfff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="1000" letter-spacing="1">DOCK?!</text>
    <rect x="5" y="184" width="454" height="44" rx="9" fill="#101419" stroke="#333c46" stroke-width="3"/>
    <text x="24" y="214" fill="#80c990" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700">$ docker ps --panic politely</text>
  </g>

  <g opacity="0.86">
